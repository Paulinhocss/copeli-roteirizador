name: control-tower-ci

on:
  push:
    branches:
      - control-tower-logistica-r1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: control-tower-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Persist lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/control-tower-logistica-r1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar package-lock do monorepo"
            git push
          fi

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
